name: Merge GIFT Nifty
on:
  push:
    paths: ["gift.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 merge_gift.py
      - name: Commit if changed
        run: |
          git config user.name "cnm-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add indices.json
          git diff --cached --quiet || (git commit -m "GIFT Nifty $(date -u +%F)" && git push)
