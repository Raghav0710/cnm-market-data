name: Update index closes
on:
  schedule:
    - cron: "45 10 * * 1-5"   # 4:15 PM IST, after NSE/BSE close
    - cron: "30 13 * * 1-5"   # 7:00 PM IST retry
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_indices.py
      - name: Commit if changed
        run: |
          git config user.name "cnm-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add indices.json
          git diff --cached --quiet || (git commit -m "Index closes $(date -u +%F)" && git push)
